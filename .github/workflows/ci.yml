name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.12 is the oldest Node Flint supports (package.json engines): its
        # SQLite binding and the test runner both need it.
        node: ["22.12", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The two suites with their own configs, the way `npm run test:all` runs
      # them. Integration tests need what only their config gives them: an
      # empty working folder per file and a longer timeout. Under the default
      # config they share the checkout as cwd and trip over each other's files.
      - run: npx vitest run --config vitest.config.unit.js
      - run: npx vitest run --config vitest.config.integration.js

  # The suites above run as the owner of a checkout they can write. This job
  # installs the package the way a server gets it (npm install -g, by root) and
  # starts it as another user with no FLINT_* variables set.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - run: sudo env "PATH=$PATH" bash scripts/install-smoke.sh .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/audit-check.sh --self-test
      - run: bash scripts/audit-check.sh
